<!doctype html>
<!-- Light is the default; mode-watcher restores saved preferences before paint. -->
<html lang="en" class="light h-full" style="color-scheme: light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="theme-color" content="#f9f7f3" />
		%sveltekit.head%
	</head>
	<body class="h-full" data-sveltekit-preload-data="hover">
		<div class="h-full" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
